<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Versão simples: fundo azul-noite e o símbolo de energia em gradiente de aurora, sem brilho.
       Sem cantos arredondados: o iOS e o Android aplicam a máscara do ícone por conta própria. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1330" />
      <stop offset="1" stop-color="#070a1a" />
    </linearGradient>
    <linearGradient id="stroke" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="740" y2="800">
      <stop offset="0" stop-color="#6af5c6" />
      <stop offset="0.5" stop-color="#4cc3ff" />
      <stop offset="1" stop-color="#b799ff" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#night)" />

  <g fill="none" stroke="url(#stroke)" stroke-width="84" stroke-linecap="round">
    <path d="M663.7 351.2 A236 236 0 1 1 360.3 351.2" />
    <path d="M512 248 V500" />
  </g>
</svg>
